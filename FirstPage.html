<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<meta http-equiv="X-UA-Compatible" content="IE=edge" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Doctor Appointment</title>
	<style>
		:root{--accent:#2b7a78;--muted:#6b7280;--bg:#f7fafc}
		*{box-sizing:border-box}
		body{font-family:Inter, system-ui, Arial, sans-serif;background:var(--bg);margin:0;color:#0f172a}
		.container{max-width:960px;margin:32px auto;padding:20px;background:#fff;border-radius:10px;box-shadow:0 6px 18px rgba(12,18,35,0.06)}
		header{display:flex;align-items:center;justify-content:space-between}
		h1{margin:0;font-size:1.4rem;color:var(--accent)}
		.grid{display:grid;grid-template-columns:1fr 360px;gap:20px;margin-top:18px}
		form{padding:12px}
		label{display:block;font-size:0.9rem;margin-bottom:6px;color:var(--muted)}
		input,select,textarea{width:git commit -m "first commit"100%;padding:10px;border:1px solid #e6e9ee;border-radius:8px;font-size:0.95rem}
		.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
		.actions{display:flex;gap:8px;margin-top:12px}
		button{background:var(--accent);color:#fff;border:none;padding:10px 12px;border-radius:8px;cursor:pointer}
		button.secondary{background:#e6eef1;color:#06323a}
		.panel{padding:12px;border-left:1px dashed #eef2f7}
		.appt{padding:10px;border:1px solid #eef2f7;border-radius:8px;margin-bottom:10px;background:#fbfeff}
		.muted{color:var(--muted);font-size:0.9rem}
		.empty{color:var(--muted);text-align:center;padding:24px}
			.cancelled{opacity:0.65;text-decoration:line-through}
		@media(max-width:880px){.grid{grid-template-columns:1fr} .row{grid-template-columns:1fr}}
	</style>
</head>
<body>
	<div class="container">
		<header>
			<h1>Doctor Appointment</h1>
			<div class="muted">Book and manage appointments</div>
		</header>

		<div class="grid">
			<section>
				<form id="bookingForm" autocomplete="off">
					<div class="row">
						<div>
							<label for="name">Full name</label>
							<input id="name" name="name" required placeholder="e.g. Priya Sharma" />
						</div>
						<div>
							<label for="phone">Phone</label>
							<input id="phone" name="phone" required placeholder="+91 98765 43210" />
						</div>
					</div>

					<label for="email">Email</label>
					<input id="email" name="email" type="email" placeholder="you@example.com" />

					<div class="row" style="margin-top:12px">
						<div>
							<label for="doctor">Doctor</label>
							<select id="doctor" name="doctor">
								<option>Dr. Amit Verma — General Physician</option>
								<option>Dr. Sangeeta Rao — Pediatrician</option>
								<option>Dr. R. K. Singh — Cardiologist</option>
								<option>Dr. Leena Patel — Dermatologist</option>
							</select>
						</div>
						<div>
							<label for="date">Date</label>
							<input id="date" name="date" type="date" required />
						</div>
					</div>

					<div class="row" style="margin-top:12px">
						<div>
							<label for="time">Time</label>
							<input id="time" name="time" type="time" required />
						</div>
						<div>
							<label for="mode">Visit type</label>
							<select id="mode" name="mode">
								<option>In-person</option>
								<option>Teleconsultation</option>
							</select>
						</div>
					</div>

					<label for="reason" style="margin-top:12px">Reason (optional)</label>
					<textarea id="reason" name="reason" rows="3" placeholder="Short description"></textarea>

					<div class="actions">
						<button type="submit">Book Appointment</button>
						<button type="button" id="clearBtn" class="secondary">Clear</button>
					</div>
				</form>
			</section>

			<aside class="panel">
				<div style="display:flex;justify-content:space-between;align-items:center">
					<strong>Appointments</strong>
					<div class="muted" id="count">0</div>
				</div>
				<div id="appointmentsList" style="margin-top:12px;min-height:160px"></div>

				<!-- Analytics -->
				<div id="analytics" style="margin-top:12px;border-top:1px dashed #eef2f7;padding-top:10px">
					<strong>Analytics</strong>
					<div style="margin-top:8px">
						<div class="muted">Total appointments: <span id="totalAppts">0</span></div>
						<div class="muted">Upcoming: <span id="upcomingAppts">0</span> · Past: <span id="pastAppts">0</span></div>
					</div>
					<div style="margin-top:8px">
						<div class="muted">By Doctor:</div>
						<div id="byDoctor" style="margin-top:6px"></div>
					</div>
					<div style="margin-top:8px">
						<div class="muted">By Mode:</div>
						<div id="byMode" style="margin-top:6px"></div>
					</div>
					<canvas id="trendCanvas" width="300" height="50" style="width:100%;height:50px;margin-top:8px;border:1px solid #eef2f7;border-radius:6px"></canvas>
				</div>
				<div style="margin-top:10px;text-align:center">
					<button id="exportBtn" class="secondary">Export JSON</button>
				</div>
			</aside>
		</div>
	</div>

	<script>
		const form = document.getElementById('bookingForm');
		const listEl = document.getElementById('appointmentsList');
		const countEl = document.getElementById('count');
		const clearBtn = document.getElementById('clearBtn');
		const exportBtn = document.getElementById('exportBtn');

		function loadAppointments(){
			try{
				return JSON.parse(localStorage.getItem('appointments')||'[]');
			}catch(e){
				return [];
			}
		}

		function saveAppointments(arr){
			localStorage.setItem('appointments', JSON.stringify(arr));
		}

		function render(){
			const appts = loadAppointments();
			countEl.textContent = appts.length;
			// update analytics regardless of whether list is empty
			renderAnalytics(appts);
			listEl.innerHTML = '';
			if(!appts.length){
				listEl.innerHTML = '<div class="empty">No appointments yet</div>';
				return;
			}
			appts.slice().reverse().forEach((a, idx) => {
				const node = document.createElement('div');
				node.className = 'appt' + (a.status === 'Cancelled' ? ' cancelled' : '');
				node.innerHTML = `
					<div style="display:flex;justify-content:space-between;align-items:center">
						<div>
							<div><strong>${escapeHtml(a.name)}</strong> <span class="muted">(${escapeHtml(a.mode)})</span></div>
							<div class="muted">${escapeHtml(a.doctor)} · ${escapeHtml(a.date)} ${escapeHtml(a.time)}</div>
						</div>
						<div style="text-align:right">
							<div class="muted">${escapeHtml(a.phone||'')}</div>
							<div style="margin-top:8px;display:flex;gap:6px;justify-content:flex-end">
								<button data-id="${a.id}" class="detailBtn secondary">Details</button>
								<button data-id="${a.id}" class="deleteBtn secondary">Cancel</button>
							</div>
						</div>
					</div>
					<div style="margin-top:8px;color:#334155">${escapeHtml(a.reason||'')}</div>
					${a.status ? '<div class="muted" style="margin-top:6px">Status: ' + escapeHtml(a.status) + '</div>' : ''}
				`;
				listEl.appendChild(node);
			});

			// attach listeners
			listEl.querySelectorAll('.deleteBtn').forEach(btn => {
				btn.addEventListener('click', e => {
					const id = btn.getAttribute('data-id');
					if(!confirm('Cancel this appointment?')) return;
					const arr = loadAppointments();
					const item = arr.find(x => x.id === id);
					if(item){
						item.status = 'Cancelled';
						item.cancelledAt = new Date().toISOString();
						saveAppointments(arr);
					}
					render();
				});
			});

			// details button navigates to detail page with id
			listEl.querySelectorAll('.detailBtn').forEach(btn => {
				btn.addEventListener('click', e => {
					const id = btn.getAttribute('data-id');
					location.href = 'AppointmentDetailPage.html?id=' + encodeURIComponent(id);
				});
			});
		}

		function escapeHtml(s){
			if(!s) return '';
			return String(s).replace(/[&<>\"']/g, c=>({ '&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;' })[c]);
		}

		form.addEventListener('submit', e => {
			e.preventDefault();
			const data = {
				id: Date.now().toString(36) + Math.random().toString(36).slice(2,7),
				name: form.name.value.trim(),
				phone: form.phone.value.trim(),
				email: form.email.value.trim(),
				doctor: form.doctor.value,
				date: form.date.value,
				time: form.time.value,
				mode: form.mode.value,
				reason: form.reason.value.trim()
			};

			if(!data.name || !data.date || !data.time || !data.phone){
				alert('Please fill required fields: name, phone, date and time.');
				return;
			}

			// basic date validation: cannot book past dates
			const sel = new Date(data.date + 'T' + (data.time||'00:00'));
			const now = new Date();
			if(sel < now){
				if(!confirm('Selected slot is in the past. Book anyway?')) return;
			}

			const arr = loadAppointments();
			arr.push(data);
			saveAppointments(arr);
			form.reset();
			render();
			alert('Appointment booked successfully.');
		});

		clearBtn.addEventListener('click', ()=> form.reset());

		exportBtn.addEventListener('click', ()=>{
			const data = loadAppointments();
			const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
			const url = URL.createObjectURL(blob);
			const a = document.createElement('a');
			a.href = url; a.download = 'appointments.json'; document.body.appendChild(a); a.click(); a.remove();
			URL.revokeObjectURL(url);
		});

		// Analytics helpers
		function computeAnalytics(appts){
			const stats = {
				total: appts.length,
				upcoming: 0,
				past: 0,
				byDoctor: {},
				byMode: {},
				last7: new Array(7).fill(0)
			};
			const now = new Date();
			const todayStart = new Date(now.getFullYear(), now.getMonth(), now.getDate());
			appts.forEach(a => {
				// parse appointment date/time
				const dt = new Date((a.date||'') + 'T' + (a.time||'00:00'));
				if(dt >= now) stats.upcoming++;
				else stats.past++;
				stats.byDoctor[a.doctor] = (stats.byDoctor[a.doctor]||0) + 1;
				stats.byMode[a.mode] = (stats.byMode[a.mode]||0) + 1;
				// last 7 days (including today)
				const dayDiff = Math.floor((dt - todayStart) / (1000*60*60*24));
				if(dayDiff >= -6 && dayDiff <= 0){
					// map -6..0 to 0..6
					stats.last7[6 + dayDiff] += 1;
				}
			});
			return stats;
		}

		function renderAnalytics(appts){
			const stats = computeAnalytics(appts);
			document.getElementById('totalAppts').textContent = stats.total;
			document.getElementById('upcomingAppts').textContent = stats.upcoming;
			document.getElementById('pastAppts').textContent = stats.past;
			const bd = document.getElementById('byDoctor'); bd.innerHTML = '';
			Object.keys(stats.byDoctor).forEach(k => {
				const div = document.createElement('div');
				div.className = 'muted';
				div.textContent = `${k} — ${stats.byDoctor[k]}`;
				bd.appendChild(div);
			});
			const bm = document.getElementById('byMode'); bm.innerHTML = '';
			Object.keys(stats.byMode).forEach(k => {
				const div = document.createElement('div');
				div.className = 'muted';
				div.textContent = `${k} — ${stats.byMode[k]}`;
				bm.appendChild(div);
			});
			// draw trend
			drawTrend(stats.last7);
		}

		function drawTrend(arr){
			const c = document.getElementById('trendCanvas');
			if(!c) return;
			const ctx = c.getContext('2d');
			const w = c.width = c.clientWidth * devicePixelRatio;
			const h = c.height = c.clientHeight * devicePixelRatio;
			ctx.clearRect(0,0,w,h);
			const max = Math.max(1, ...arr);
			const pad = 6 * devicePixelRatio;
			const step = (w - pad*2) / (arr.length - 1 || 1);
			ctx.strokeStyle = '#2b7a78'; ctx.lineWidth = 2 * devicePixelRatio; ctx.beginPath();
			arr.forEach((v,i)=>{
				const x = pad + i * step;
				const y = h - pad - (v / max) * (h - pad*2);
				if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
				// draw point
				ctx.fillStyle = '#2b7a78'; ctx.beginPath(); ctx.arc(x,y,2.5*devicePixelRatio,0,Math.PI*2); ctx.fill();
			});
			ctx.stroke();
		}

		// initial render
		render();
	</script>
</body>
</html>
